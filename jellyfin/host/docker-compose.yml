services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 501:100
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - type: bind
        source: /mnt/nfs/Media
        target: /media
        read_only: true
    network_mode: host
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache: 
