version: '3.8'

services:
  wallos:
    image: bellamy/wallos:latest  # or ellite/wallos depending on the preferred build
    container_name: wallos
    ports:
      - "8282:80"                  # Access the web UI at http://<your-ip>:8282
    volumes:
      - /opt/docker-persist/wallos/db:/var/www/html/db
      - /opt/docker-persist/wallos/logos:/var/www/html/images/uploads/logos
    environment:
      - TZ=Europe/London           # Change to your timezone
    restart: unless-stopped

